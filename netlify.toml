# Netlify — Despliegue del frontend (React + Vite)
# El backend vive en Render (ver render.yaml).

[build]
  base = "frontend"
  command = "npm ci && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# SPA: cualquier ruta del cliente (consultas, usuarios, etc.) cae en index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Caché: los assets con hash son inmutables; el HTML nunca se cachea
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"